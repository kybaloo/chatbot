[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-telegram-mistral"
version = "1.0.2"
description = "Chatbot Telegram intelligent intégré à Mistral AI avec API REST FastAPI et déploiement AWS"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "kybaloo", email = "kybaloo@example.com"}
]
maintainers = [
    {name = "kybaloo", email = "kybaloo@example.com"}
]
keywords = [
    "chatbot",
    "telegram",
    "mistral",
    "ai",
    "fastapi",
    "aws",
    "dynamodb",
    "lambda",
    "python"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=7.0.0",
    "fastapi[standard]>=0.104.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.26.0",
    "mangum>=0.17.0",
    "httpx>=0.24.0",
    "mistralai>=1.8.0",
    "python-telegram-bot>=22.0.0",
    "requests>=2.28.0",
    "uvicorn[standard]>=0.23.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0"
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0"
]
deploy = [
    "aws-sam-cli>=1.100.0"
]

[project.urls]
Homepage = "https://github.com/kybaloo/chatbot"
Documentation = "https://github.com/kybaloo/chatbot#readme"
Repository = "https://github.com/kybaloo/chatbot.git"
Issues = "https://github.com/kybaloo/chatbot/issues"
Changelog = "https://github.com/kybaloo/chatbot/blob/main/CHANGELOG.md"

[project.scripts]
chatbot = "src.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.txt", "*.md"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    "build",
    "dist"
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    "\.venv",
    "build",
    "dist"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/.*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:"
]
